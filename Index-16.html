<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HUD & YouTube Player</title>
<style>
:root{
  --bg:#0d0a1c;
  --card:#191430;
  --card2:#231c42;
  --border:rgba(255,255,255,.08);
  --text:#f8fafc;
  --muted:#94a3b8;
  --accent:#7c3aed;
  --red:#ef4444;
  --green:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* Nửa trên: HUD tốc độ & đồng hồ */
.hud{
  flex:0 0 48%;
  min-height:280px;
  background:linear-gradient(180deg,#15102b 0%,#0f0b21 100%);
  border-bottom:1px solid var(--border);
  padding:10px 14px 12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.top-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
}
.greet{color:#cbd5e1;white-space:nowrap}
.greet strong{color:#fff;font-weight:700}
.status-icons{
  display:flex;
  align-items:center;
  gap:8px;
  color:#94a3b8;
  font-size:12px;
}
.status-icons .on{color:#34d399}
.icon-btn{
  background:var(--card2);
  border:1px solid var(--border);
  color:#e2e8f0;
  border-radius:8px;
  padding:3px 7px;
  font-size:11px;
  cursor:pointer;
}
.weather{
  display:flex;
  align-items:center;
  gap:4px;
  background:var(--card2);
  padding:4px 8px;
  border-radius:999px;
  font-weight:600;
  font-size:12px;
  color:#e2e8f0;
}

.clock-box{text-align:center;margin-top:2px}
.clock{
  font-size:42px;
  line-height:1.05;
  font-weight:800;
  letter-spacing:1px;
  color:#fff;
}
.date{font-size:12px;color:var(--muted);margin-top:2px}

.gauges{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:24px;
  margin:4px 0;
}
.speed-ring{
  width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle at center,#18132e 62%,transparent 63%),
             conic-gradient(#38bdf8 var(--deg,0deg),rgba(255,255,255,.12) 0deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(56,189,248,.14);
}
.speed-val{font-size:28px;font-weight:800;line-height:1}
.speed-unit{font-size:10px;color:var(--muted);margin-top:2px}

.sign-limit{
  width:78px;height:78px;border-radius:50%;
  background:#fff;
  border:8px solid var(--red);
  color:#111827;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:900;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  cursor:pointer;
}

.hud-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.hud-btn{
  width:38px;height:34px;border-radius:10px;
  background:var(--card2);border:1px solid var(--border);
  color:#e2e8f0;font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}

/* Nửa dưới: Trình phát YouTube + điều khiển */
.player-wrap{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#090714;
  padding:8px 10px 10px;
  gap:8px;
}
.yt-stage{
  position:relative;
  flex:1;
  min-height:150px;
  border-radius:14px;
  overflow:hidden;
  background:#000;
  border:1px solid var(--border);
}
#ytPlayer{width:100%;height:100%}
#ytPlayer iframe{width:100%;height:100%;border:0}

/* Lớp phủ điều khiển kiểu video */
.yt-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.78) 100%);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:10px;
  transition:opacity .2s;
}
.yt-overlay.hidden{opacity:0;pointer-events:none}

.yt-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.yt-meta{display:flex;align-items:center;gap:8px;min-width:0}
.yt-thumb{
  width:34px;height:34px;border-radius:50%;
  object-fit:cover;border:1px solid rgba(255,255,255,.25);flex-shrink:0;
}
.yt-title{
  font-size:13px;font-weight:700;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.yt-sub{font-size:11px;color:#cbd5e1}
.yt-top-btns{display:flex;gap:6px;flex-shrink:0}
.pill-btn{
  background:rgba(20,20,30,.78);
  border:1px solid rgba(255,255,255,.16);
  color:#fff;border-radius:999px;
  padding:5px 9px;font-size:11px;font-weight:600;cursor:pointer;
}

.yt-center{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:26px;
}
.ctrl-btn{
  width:46px;height:46px;border-radius:50%;
  background:rgba(15,15,25,.72);
  border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:18px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.ctrl-btn.main{width:56px;height:56px;font-size:22px;background:rgba(124,58,237,.85)}

.yt-bottom{display:flex;flex-direction:column;gap:6px}
.seek-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#e2e8f0}
input[type=range]{
  flex:1;accent-color:#ef4444;height:4px;cursor:pointer;
}
.yt-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.playlist-strip{
  display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;
}
.playlist-strip::-webkit-scrollbar{display:none}
.track-chip{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.12);
  color:#e2e8f0;border-radius:8px;
  padding:4px 8px;font-size:11px;white-space:nowrap;cursor:pointer;
}
.track-chip.active{background:#ef4444;border-color:#ef4444;color:#fff;font-weight:700}

/* Thanh nhập link/tìm nhanh bên dưới */
.quick-bar{
  display:flex;gap:6px;
}
.quick-bar input{
  flex:1;background:var(--card);border:1px solid var(--border);
  color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;
}
.quick-bar button{
  background:var(--accent);color:#fff;border:0;border-radius:10px;
  padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;
}

/* Modal cài đặt nhanh */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:50;
}
.modal.open{display:flex}
.modal-card{
  width:100%;max-width:360px;background:var(--card);
  border:1px solid var(--border);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.modal-card h3{font-size:15px}
.modal-card label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.modal-card input{
  background:var(--bg);border:1px solid var(--border);
  color:#fff;border-radius:8px;padding:7px 9px;font-size:13px;
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
</style>
</head>
<body>

<section class="hud" id="hudSection">
  <div class="top-bar">
    <div class="greet">Xin chào <strong id="userName">A sơn</strong></div>
    <div class="status-icons">
      <span id="gpsIcon" title="GPS">📍</span>
      <span class="on" title="Âm thanh">🔊</span>
      <button class="icon-btn" id="refreshBtn" title="Làm mới vị trí">↻</button>
    </div>
    <div class="weather"><span>☁️</span><span id="tempVal">19°C</span></div>
  </div>

  <div class="clock-box">
    <div class="clock" id="clockText">11:17</div>
    <div class="date" id="dateText">Thứ tư, 25 tháng 11</div>
  </div>

  <div class="gauges">
    <div class="speed-ring" id="speedRing">
      <div class="speed-val" id="speedVal">0</div>
      <div class="speed-unit">km/h</div>
    </div>
    <div class="sign-limit" id="limitSign" title="Bấm để đổi giới hạn tốc độ">50</div>
  </div>

  <div class="hud-actions">
    <button class="hud-btn" id="fsBtn" title="Toàn màn hình">⛶</button>
    <button class="hud-btn" id="cfgBtn" title="Cài đặt">⚙️</button>
  </div>
</section>

<section class="player-wrap">
  <div class="yt-stage" id="ytStage">
    <div id="ytPlayer"></div>

    <div class="yt-overlay" id="ytOverlay">
      <div class="yt-top">
        <div class="yt-meta">
          <img class="yt-thumb" id="trackThumb" src="" alt="">
          <div style="min-width:0">
            <div class="yt-title" id="trackTitle">Đang tải...</div>
            <div class="yt-sub" id="trackChannel">YouTube Playlist</div>
          </div>
        </div>
        <div class="yt-top-btns">
          <button class="pill-btn" id="muteBtn">🔊</button>
          <button class="pill-btn" id="openYtBtn">YouTube ↗</button>
        </div>
      </div>

      <div class="yt-center">
        <button class="ctrl-btn" id="prevBtn" title="Bài trước">⏮</button>
        <button class="ctrl-btn main" id="playBtn" title="Phát / Tạm dừng">▶</button>
        <button class="ctrl-btn" id="nextBtn" title="Bài tiếp">⏭</button>
      </div>

      <div class="yt-bottom">
        <div class="seek-row">
          <span id="curTime">0:00</span>
          <input type="range" id="seekBar" min="0" max="100" value="0" step="1">
          <span id="durTime">0:00</span>
        </div>
        <div class="yt-foot">
          <div class="playlist-strip" id="playlistStrip"></div>
          <button class="pill-btn" id="toggleHudBtn">Ẩn HUD</button>
        </div>
      </div>
    </div>
  </div>

  <div class="quick-bar">
    <input id="ytInput" placeholder="Dán link / ID YouTube hoặc gõ từ khóa mở trên YT...">
    <button id="ytLoadBtn">Phát</button>
  </div>
</section>

<div class="modal" id="cfgModal">
  <div class="modal-card">
    <h3>Cài đặt nhanh</h3>
    <label>Tên hiển thị lời chào
      <input id="cfgName" value="A sơn">
    </label>
    <label>Giới hạn tốc độ (km/h)
      <input id="cfgLimit" type="number" value="50" min="10" max="160">
    </label>
    <label>Nhiệt độ hiển thị (°C)
      <input id="cfgTemp" type="number" value="19" min="-10" max="50">
    </label>
    <div class="modal-actions">
      <button class="pill-btn" id="cfgCancel">Đóng</button>
      <button class="pill-btn" style="background:#7c3aed" id="cfgSave">Lưu</button>
    </div>
  </div>
</div>

<script>
// Danh sách bài hát (bạn có thể thay hoặc thêm videoId bất kỳ)
var PLAYLIST = [
  { id: "M7lc1UVf-VE", title: "YouTube Developers Live", channel: "Google Developers" },
  { id: "jfKfPfyJRdk", title: "Lofi Hip Hop Radio - Beats to Relax", channel: "Lofi Girl" },
  { id: "5qap5aO4i9A", title: "Chill Synthwave & Ambient Mix", channel: "Chillhop" }
];

var currentIdx = 0;
var player = null;
var isReady = false;
var isSeeking = false;
var speedLimit = 50;

// Đồng hồ & ngày tháng tiếng Việt
function updateClock() {
  var now = new Date();
  var hh = String(now.getHours()).padStart(2, "0");
  var mm = String(now.getMinutes()).padStart(2, "0");
  clockText.textContent = hh + ":" + mm;

  var days = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
  dateText.textContent = days[now.getDay()] + ", " + now.getDate() + " tháng " + (now.getMonth() + 1);
}
updateClock();
setInterval(updateClock, 1000);

// Tốc độ GPS thực tế
function setSpeed(kmh) {
  var val = Math.max(0, Math.round(kmh || 0));
  speedVal.textContent = val;
  var ratio = Math.min(1, val / Math.max(20, speedLimit * 1.4));
  speedRing.style.setProperty("--deg", (ratio * 360) + "deg");
  speedRing.style.boxShadow = val > speedLimit
    ? "0 0 22px rgba(239,68,68,.55)"
    : "0 0 20px rgba(56,189,248,.16)";
}

function startGps() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(
    function(pos) {
      gpsIcon.classList.add("on");
      var mps = pos.coords.speed;
      setSpeed(mps != null && mps > 0 ? mps * 3.6 : 0);
    },
    function() {
      gpsIcon.classList.remove("on");
    },
    { enableHighAccuracy: true, maximumAge: 1000, timeout: 8000 }
  );
}
startGps();
refreshBtn.onclick = startGps;

// Đổi giới hạn tốc độ nhanh khi bấm biển báo
var limits = [40, 50, 60, 80, 90];
limitSign.onclick = function() {
  var idx = limits.indexOf(speedLimit);
  speedLimit = limits[(idx + 1) % limits.length];
  limitSign.textContent = speedLimit;
  setSpeed(Number(speedVal.textContent));
};

// Toàn màn hình & cài đặt
fsBtn.onclick = function() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function(){});
  } else {
    document.exitFullscreen && document.exitFullscreen().catch(function(){});
  }
};
cfgBtn.onclick = function() {
  cfgName.value = userName.textContent;
  cfgLimit.value = speedLimit;
  cfgTemp.value = parseInt(tempVal.textContent, 10) || 19;
  cfgModal.classList.add("open");
};
cfgCancel.onclick = function() { cfgModal.classList.remove("open"); };
cfgSave.onclick = function() {
  if (cfgName.value.trim()) userName.textContent = cfgName.value.trim();
  if (Number(cfgLimit.value) > 0) {
    speedLimit = Number(cfgLimit.value);
    limitSign.textContent = speedLimit;
  }
  tempVal.textContent = (Number(cfgTemp.value) || 19) + "°C";
  setSpeed(Number(speedVal.textContent));
  cfgModal.classList.remove("open");
};

// Render danh sách bài
function renderPlaylist() {
  playlistStrip.innerHTML = "";
  PLAYLIST.forEach(function(item, i) {
    var btn = document.createElement("button");
    btn.className = "track-chip" + (i === currentIdx ? " active" : "");
    btn.textContent = (i + 1) + ". " + item.title;
    btn.onclick = function(e) {
      e.stopPropagation();
      loadTrack(i, true);
    };
    playlistStrip.appendChild(btn);
  });
}

function updateTrackMeta() {
  var item = PLAYLIST[currentIdx];
  trackTitle.textContent = item.title;
  trackChannel.textContent = item.channel;
  trackThumb.src = "https://i.ytimg.com/vi/" + item.id + "/hqdefault.jpg";
  renderPlaylist();
}

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  return m + ":" + String(s).padStart(2, "0");
}

function loadTrack(idx, autoplay) {
  if (idx < 0) idx = PLAYLIST.length - 1;
  if (idx >= PLAYLIST.length) idx = 0;
  currentIdx = idx;
  updateTrackMeta();
  seekBar.value = 0;
  curTime.textContent = "0:00";
  durTime.textContent = "0:00";

  if (isReady && player && player.loadVideoById) {
    if (autoplay) player.loadVideoById(PLAYLIST[currentIdx].id);
    else player.cueVideoById(PLAYLIST[currentIdx].id);
  }
}

// Tải YouTube IFrame Player API
var tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function() {
  updateTrackMeta();
  player = new YT.Player("ytPlayer", {
    videoId: PLAYLIST[currentIdx].id,
    playerVars: {
      playsinline: 1,
      rel: 0,
      modestbranding: 1
    },
    events: {
      onReady: function() {
        isReady = true;
        updateTrackMeta();
      },
      onStateChange: function(e) {
        if (e.data === YT.PlayerState.PLAYING) {
          playBtn.textContent = "⏸";
          var data = player.getVideoData && player.getVideoData();
          if (data && data.title) trackTitle.textContent = data.title;
          if (data && data.author) trackChannel.textContent = data.author;
        } else if (e.data === YT.PlayerState.PAUSED) {
          playBtn.textContent = "▶";
        } else if (e.data === YT.
